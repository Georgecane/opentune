name: OpenTune CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentune-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Zig 0.17.1 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zig 0.17.1
        run: |
          curl -fsSLO https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
          tar -xf zig-x86_64-linux-0.17.1.tar.xz
          echo "${PWD}/zig-x86_64-linux-0.17.1" >> "${GITHUB_PATH}"

      - name: Verify Zig version
        run: test "$(zig version)" = "0.17.1"

      - name: Check formatting
        run: zig fmt --check src tests build.zig build.zig.zon

      - name: Run tests
        run: zig build test -Doptimize=Debug --summary all

      - name: Build Debug
        run: zig build -Doptimize=Debug --summary all

      - name: Build ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe --summary all
